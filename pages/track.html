<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>克代同堂跑道</title>
<style>
@font-face { font-family: "ChillRound"; src: url("fonts/ChillRoundM.ttf") format("truetype"); font-display: block; }
/* v5（10-27）：跑道 + 定下的队伍小组件 v11 拼成一个界面，不改小组件的样子和交互
   平时只有主 AI（姿势 = 进度）；碰它停半秒 = 小组件（队友从头后面探出来、头顶是「手」、脚下一排小圆圈）；点它 = 跑道横着长出来
   接棒 = 把主 AI 拖到脚下的一个小圆圈上 */
:root {
  --paper: #FBF8F2; --ink: #26231F; --sub: #6E6A63; --pencil: #9C968C; --faint: #C6C0B5; --line: #E6DFD3;
  --accent: #D77757; --warn: #C98A2E; --hot: #C4472F; --bg: #ECE8E0;
  --hand: "ChillRound", "KaiTi", "STKaiti", "Kaiti SC", serif;   /* 10-28 用户选寒蝉半圆体（OFL 开源，可随软件发布）；缺的字用楷体补 */
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--hand); }
.wrap { max-width: 460px; margin: 28px auto; padding: 0 16px; }

/* 整块高度永远不变 */
.dock { position: relative; background: var(--paper); border-radius: 10px; height: 200px; overflow: hidden; }
.stage { position: absolute; inset: 0; transition: transform .7s cubic-bezier(.6,0,.3,1), opacity .4s; }
.stage.leave { transform: translateX(-110%); opacity: 0; }
.stage.enter { transform: translateX(105%); transition: none; }

/* 跑道：平时不显示（小克的姿势本身就是进度）；点开从小克脚下往右横着长；队伍小组件出来时先让开 */
.bar { position: absolute; left: 56px; width: 300px; top: 128px; height: 30px; transform: scaleX(0); transform-origin: 0 50%; transition: transform .55s cubic-bezier(.3,1.15,.5,1), opacity .2s; }
.dock.open .bar { transform: scaleX(1); }
.dock.team .bar, .dock.handing .bar { opacity: 0; }   /* 小组件或交棒的弧出来时，跑道先让开 */
.bar .clip { position: absolute; inset: 0; transition: transform .16s ease-in; transform-origin: 50% 50%; clip-path: polygon(14px 0, 272px 0, 300px 50%, 272px 100%, 14px 100%, 0 50%); background: #F3EEE5; }
.bar .clip::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, var(--faint) 1.2px, transparent 1.6px) 0 50% / 44px 100% repeat-x; left: 40%; }
.scene { position: absolute; left: 0; top: 0; bottom: 0; width: 0; transition: width .6s cubic-bezier(.3,1.1,.5,1); animation: roll linear infinite; z-index: 1; }
@keyframes roll { to { background-position-x: -200px, -200px, -200px; } }
.scene.s0 { background: radial-gradient(circle, #fff 1px, transparent 1.6px) 0 0 / 15px 13px, radial-gradient(circle, #FFE9A8 1.2px, transparent 1.8px) 7px 8px / 23px 17px, #232A5C; animation-duration: 1.2s; }
.scene.s1 { background: radial-gradient(ellipse 14px 7px, #fff 60%, transparent 66%) 0 9px / 50px 30px, radial-gradient(ellipse 10px 5px, #fff 60%, transparent 66%) 26px 20px / 50px 30px, linear-gradient(#A8D8F2, #DDF1FB); animation-duration: 2.4s; }
.scene.s2 { background: linear-gradient(transparent 46%, rgba(255,255,255,.85) 46% 54%, transparent 54%), linear-gradient(90deg, rgba(255,255,255,.55) 0 2px, transparent 2px) 0 0 / 40px 100%, #D9735A; animation-duration: 4.5s; }
.scene.s3 { background: radial-gradient(circle at 50% 130%, #D7AE66 45%, transparent 47%) 0 0 / 34px 30px, radial-gradient(circle, #C79A50 1px, transparent 1.6px) 5px 6px / 11px 9px, #EACB8E; animation-duration: 9s; }
.scene.s4 { background: linear-gradient(45deg, #E59A86 25%, #F4C9BD 25% 50%, #E59A86 50% 75%, #F4C9BD 75%) 0 0 / 24px 24px; animation-name: rollStripe; animation-duration: 15.36s; }   /* 11-06 修竖缝：条纹画在 24px 小砖上、移动距离是砖的整数倍，照 Bootstrap 进度条的做法；原来没定砖大小，整条跑道算一块砖，砖和砖接不上 */
@keyframes rollStripe { to { background-position-x: -192px; } }
.bar.flip .clip { transform: scaleY(0); }
.bar { cursor: pointer; }
/* 这周的跑道：分成 7 段，一天一段，从回满那天数起 */
.days { position: absolute; left: 14px; right: 28px; top: 0; bottom: 0; display: flex; z-index: 2; pointer-events: none; opacity: 0; transition: opacity .1s; }
.bar.wk .days { opacity: 1; }
.days span { flex: 1; position: relative; }
.days span + span::before, .days span + span::after { content: ""; position: absolute; left: 0; height: 7px; border-left: 1.6px solid rgba(38,35,31,.42); border-radius: 1px; }
.days span + span::before { top: 2px; }
.days span + span::after { bottom: 2px; }
.bar.wk .clip::after { display: none; }
/* 每一段有自己的小动效（学参考「动态思考强度」：每档一种，都很轻） */
.scene::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
.scene.s0::after { background: radial-gradient(circle, #fff 1.3px, transparent 2px) 4px 3px / 19px 15px, radial-gradient(circle, #FFE9A8 1.1px, transparent 1.7px) 12px 10px / 27px 21px; animation: twinkle 1.6s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .1; } to { opacity: 1; } }
.scene.s1 { animation-name: drift; }
@keyframes drift { from { background-position: 0 9px, 26px 20px, 0 0; } to { background-position: -100px 9px, -24px 20px, 0 0; } }
.scene.s2::after { background: linear-gradient(90deg, transparent 0 55%, rgba(255,255,255,.75) 55% 85%, transparent 85%) 0 26% / 70px 1.6px repeat-x, linear-gradient(90deg, transparent 0 60%, rgba(255,255,255,.6) 60% 90%, transparent 90%) 30px 76% / 90px 1.6px repeat-x; animation: streak .55s linear infinite; }
@keyframes streak { to { background-position: -70px 26%, -60px 76%; } }
.scene.s3::after { background: radial-gradient(circle, rgba(255,250,235,.9) 1.6px, transparent 2.2px) 0 0 / 23px 30px, radial-gradient(circle, rgba(255,250,235,.7) 1.2px, transparent 1.8px) 11px 14px / 31px 30px; animation: dust 1.9s linear infinite; }
@keyframes dust { from { background-position: 0 30px, 11px 44px; opacity: 1; } to { background-position: -14px 0, -3px 14px; opacity: 0; } }
.scene.s4::after { animation: alarm 1.1s ease-in-out infinite; }
@keyframes alarm { 50% { background: rgba(255,255,255,.32); } }
@media (prefers-reduced-motion: reduce) { .scene, .scene::after { animation: none; } }
.bar svg { position: absolute; left: -2px; top: -2px; width: 304px; height: 34px; overflow: visible; z-index: 2; }

/* 主 AI 和贴着它的东西（探头的队友、头顶的手）放在一起，跟着它走 */
.who.dragging { z-index: 9; }   /* 拖着的小克在最上面，不被终点那道弧挡住 */
.who { position: absolute; left: 56px; bottom: 70px; transition: left .55s cubic-bezier(.3,1.15,.5,1); z-index: 3; }
.runner { position: relative; z-index: 2; display: block; cursor: pointer; transform-origin: 50% 100%; touch-action: none; user-select: none; -webkit-user-drag: none; }
.runner.fast { animation: bob .35s infinite; }
.runner.mid { animation: bob .7s infinite; }
.runner.slow { animation: bob 1.8s infinite ease-in-out; }
@keyframes bob { 0%,100% { translate: 0 0; } 50% { translate: 0 -3px; } }
.runner.hop { animation: hop .35s ease-out; }   /* 放在 bob 后面，才压得住 */
@keyframes hop { 40% { translate: 0 -6px; } }
.runner.nudge { animation: nudge 1.1s ease-in-out 2; }   /* 往右蹭两下：拖我 */
@keyframes nudge { 30% { translate: 8px 0; } 55% { translate: 0 0; } }
.runner.swapout { animation: swapout .28s ease-in forwards; }   /* 交出去的缩下去 */
@keyframes swapout { to { transform: scale(.2) translateY(20px); opacity: 0; } }
.runner.swapin { animation: swapin .45s cubic-bezier(.3,1.6,.5,1); }   /* 接棒的在同一个地方弹出来 */
@keyframes swapin { from { transform: scale(.2); opacity: 0; } }
.runner.drag { animation: none; cursor: grabbing; z-index: 6; filter: drop-shadow(0 4px 0 rgba(38,35,31,.15)); }

/* 小组件 v11：队友一次一个，从主 AI 头后面探出来 */
/* 队友从主 AI 左后方斜着探出来（10-27 用户：别叠在头顶，太往上） */
.peeks { position: absolute; right: calc(100% - 26px); bottom: 0; width: 96px; height: 90px; overflow: hidden; pointer-events: none; z-index: 1; }
.peek { position: absolute; right: 0; bottom: 0; transform-origin: 80% 100%; transform: translateX(115%) rotate(20deg); transition: transform .38s cubic-bezier(.3,1.35,.5,1); }
.peek.up { transform: translate(-8px, -12px) rotate(-28deg); }
/* 「负责」小牌：写着当前分身负责什么，右边小数字 = 第几个 / 一共几个分身；点了拉开成分身小列表 */
/* 「负责」：跟「手」「模型」一样的圆按钮，圈里的小图标按「负责什么」那句话自动挑；圈下面几个小点 = 几个分身，实心 = 当前 */
.job { position: absolute; z-index: 3; left: 43px; bottom: calc(100% + 4px); width: 30px; height: 30px; border-radius: 50%; border: 1.8px solid #1F1E1C; background: #FFFFFF; display: grid; place-items: center; cursor: pointer; padding: 0; color: #1F1E1C; transform: scale(0); transform-origin: 50% 50%; transition: transform .3s cubic-bezier(.3,1.5,.5,1) .08s; }
.job svg { width: 18px; height: 18px; }
.job.none { color: #BDB7AC; }
.job .lv { position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%); display: flex; gap: 3px; }
.job .lv i { width: 4px; height: 4px; border-radius: 50%; background: #BDB7AC; }
.job .lv i.on { background: #1F1E1C; }
.dock.team .job { transform: scale(1); }
.dock.team .job.hide, .dock.team .model.on ~ .job { transform: scale(0); transition-delay: 0s; }
.job.pop { animation: jobpop .45s cubic-bezier(.3,1.6,.5,1); }   /* 换了分身，图标轻轻弹一下 */
@keyframes jobpop { 40% { transform: scale(1.22); } }
/* 分身小列表：跟模型选择框一样的样子；每行 = 负责什么 · 模型；当前那行有底色，点它 = 改负责；最后一行加分身 */
.cbox { position: absolute; z-index: 6; left: 43px; bottom: calc(100% + 4px); width: 30px; height: 30px; border: 1.8px solid #1F1E1C; border-radius: 12px; background: #FFFFFF; overflow: hidden; opacity: 0; pointer-events: none; transition: width .34s cubic-bezier(.3,1.2,.5,1), height .34s cubic-bezier(.3,1.2,.5,1), margin-bottom .34s cubic-bezier(.3,1.2,.5,1), opacity .15s; }
.cbox.on { opacity: 1; pointer-events: auto; }
.cwin { position: absolute; inset: 4px 3px 4px 4px; overflow-x: hidden; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #C9C2B6 transparent; }
.cwin div { height: 20px; line-height: 20px; padding: 0 8px; border-radius: 7px; font-family: var(--hand); font-size: 12.5px; color: var(--sub); white-space: nowrap; cursor: pointer; }
.cwin div i { font: 10.5px system-ui, sans-serif; font-style: normal; color: var(--pencil); margin-left: 6px; }
.cwin div svg { width: 14px; height: 14px; vertical-align: -2px; margin-right: 5px; color: var(--ink); border-radius: 4px; }
.cwin div svg.pick:hover { background: #EDE5D8; outline: 3px solid #EDE5D8; }   /* 行前的图标能点：点了换图标 */
/* 换图标：同一个框里变成一排图标 */
.cwin .icons { height: auto; padding: 3px 2px; display: grid; grid-template-columns: repeat(6, 24px); gap: 3px; cursor: default; }
.cwin .icons:hover { background: none; }
.cwin .icons b { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; color: var(--ink); }
.cwin .icons b:hover { background: #F3EEE5; }
.cwin .icons b.on { background: #F6EDE6; outline: 1.5px solid var(--accent); }
.cwin .icons b svg { width: 15px; height: 15px; margin: 0; }
.cwin .icons .auto { grid-column: span 6; width: auto; height: 20px; font-size: 12px; color: var(--accent); justify-content: start; padding: 0 4px; }
.cwin div:hover { background: #F3EEE5; color: var(--ink); }
.cwin div.sel { background: #F6EDE6; color: var(--ink); }
.cwin div.add { color: var(--accent); }
.cwin input { width: 100%; height: 20px; border: 0; outline: 0; background: transparent; font: inherit; color: var(--ink); padding: 0; }   /* 从小克左后方斜着探出来；探头的手 10-27 补全了 */
/* 头顶：派活的手（连点换 关 / 低 / 中 / 高） */
.handbtn { position: absolute; z-index: 3; left: -14px; bottom: calc(100% + 4px); width: 30px; height: 30px; border-radius: 50%; border: 1.8px solid #1F1E1C; background: #FFFFFF; display: grid; place-items: center; cursor: pointer; padding: 0; color: #BDB7AC; transform: translateX(-50%) scale(0); transition: transform .3s cubic-bezier(.3,1.5,.5,1); }
.dock.team .handbtn { transform: translateX(-50%) scale(1); }
.dock.team .model { transform: scale(1); }
.handbtn[aria-pressed="true"] { color: #1F1E1C; }
/* 模型：平时是跟「手」一样的圆按钮；点了，同一个圆拉开成选择框（图标被吃掉），宽度跟着最长的模型名，点一行就换，多了能滚 */
.model { position: absolute; z-index: 6; left: 7px; bottom: calc(100% + 4px); width: 30px; height: 30px; border: 1.8px solid #1F1E1C; border-radius: 15px; background: #FFFFFF; overflow: hidden; transform: scale(0); transform-origin: 15px 50%; transition: transform .3s cubic-bezier(.3,1.5,.5,1) .04s, width .36s cubic-bezier(.3,1.2,.5,1), height .36s cubic-bezier(.3,1.2,.5,1), margin-bottom .36s cubic-bezier(.3,1.2,.5,1), border-radius .3s; font-family: system-ui, sans-serif; }
.model.on { border-radius: 12px; }
.model.left { left: auto; right: calc(100% - 37px); transform-origin: calc(100% - 15px) 15px; }
.mic { position: absolute; left: 0; top: 0; width: 26.4px; height: 26.4px; border: 0; background: none; padding: 0; display: grid; place-items: center; cursor: pointer; color: #1F1E1C; transition: opacity .12s, transform .2s; }
.model.left .mic { left: auto; right: 0; }
.model.on .mic { opacity: 0; transform: scale(.4); pointer-events: none; }
.mic svg { width: 18px; height: 18px; }
.mwin { position: absolute; inset: 4px 3px 4px 4px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #C9C2B6 transparent; opacity: 0; pointer-events: none; transition: opacity .12s; }
.mwin::-webkit-scrollbar { width: 4px; }
.mwin::-webkit-scrollbar-thumb { background: #C9C2B6; border-radius: 4px; }
.mwin::-webkit-scrollbar-track { background: transparent; }
.model.on .mwin { opacity: 1; pointer-events: auto; transition: opacity .2s .14s; }
.reel div { height: 20px; line-height: 20px; padding: 0 8px; border-radius: 7px; font-size: 12px; color: #6E6A63; white-space: nowrap; cursor: pointer; }
.reel div:hover { background: #F3EEE5; color: #1F1E1C; }
.reel div.sel { background: #F6EDE6; color: #1F1E1C; font-weight: 600; }
.reel div.own { font-style: italic; }
.reel div.fill { color: var(--accent); }
.reel input { width: 100%; height: 20px; border: 0; outline: 0; background: transparent; font: inherit; font-size: 12px; color: #1F1E1C; padding: 0; }
.tipbox { position: fixed; z-index: 30; max-width: 220px; background: var(--paper); border: 1.6px solid #1F1E1C; border-radius: 12px 10px 13px 11px; padding: 6px 10px; font-family: var(--hand); font-size: 13px; line-height: 1.45; color: var(--ink); box-shadow: 0 3px 0 rgba(38,35,31,.12); pointer-events: none; opacity: 0; transition: opacity .15s; white-space: normal; overflow-wrap: anywhere; }
.tipbox.on { opacity: 1; }
.ctx { position: absolute; z-index: 9; background: var(--paper); border: 1.6px solid #1F1E1C; border-radius: 13px 11px 14px 12px; padding: 4px; font-family: var(--hand); font-size: 15px; box-shadow: 0 3px 0 rgba(38,35,31,.12); display: none; }
.ctx.on { display: block; }
.ctx button { display: flex; align-items: center; gap: 6px; border: 0; background: none; font: inherit; color: var(--ink); padding: 4px 12px 4px 8px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
.ctx svg { width: 18px; height: 16px; color: var(--sub); }
.ctx b { width: 18px; font: 600 10px system-ui, sans-serif; color: var(--sub); text-align: center; }
.ctx button:hover { background: #F6EDE6; }
.handbtn svg { width: 18px; height: 18px; }
.handbtn .lv { position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%); display: flex; gap: 3px; }
.handbtn .lv i { width: 4px; height: 4px; border-radius: 50%; background: #BDB7AC; }
.handbtn .lv i.on { background: #1F1E1C; }

/* 小组件 v11：脚下一排小圆圈 = 队友（圈里小头、圈有多满 = 还剩多少额度），最后「＋」= 设置页 */
.dots { position: absolute; top: 134px; z-index: 4; display: flex; gap: 7px; align-items: center; opacity: 0; pointer-events: none; transition: opacity .2s, left .55s cubic-bezier(.3,1.15,.5,1); }
.dock.team .dots { opacity: 1; pointer-events: auto; }
.dot { width: 26px; height: 26px; border: 0; background: none; padding: 0; cursor: grab; position: relative; transition: transform .2s; touch-action: none; }
.dot svg { width: 26px; height: 26px; display: block; }
.dot .face { position: absolute; left: 50%; top: 50%; width: 14px; transform: translate(-50%, -46%); pointer-events: none; }
.dot.on { transform: scale(1.25); }
/* 终点：能接棒的号排成一道弧，从右边跑进来；拖到谁身上，谁伸手要棒 */
.fan { position: absolute; inset: 0; pointer-events: none; z-index: 7; }
.cand { position: absolute; width: 40px; margin: -24px 0 0 -20px; text-align: center; opacity: 0; transform: translate(var(--fx, 0), var(--fy, 40px)) scale(.3); transition: transform .45s cubic-bezier(.3,1.3,.5,1), opacity .25s; pointer-events: none; }
.fan.on .cand { opacity: 1; transform: none; pointer-events: auto; cursor: pointer; }
/* 弧上 = 等着接棒的人：站着的小人（跟脚下「看队友」的小圆圈不一样），脚下一根小额度条 */
.cman { position: relative; width: 40px; margin: 0 auto; transition: transform .25s cubic-bezier(.3,1.6,.5,1); transform-origin: 50% 100%; }
.cman img { display: block; margin: 0 auto; }
.cman .q { display: block; width: 26px; height: 4px; margin: 2px auto 0; border-radius: 3px; background: #E7E0D4; overflow: hidden; }
.cman .q i { display: block; height: 100%; border-radius: 3px; }
.cman .q.none { background: repeating-linear-gradient(90deg, #CFC8BC 0 3px, transparent 3px 6px); }
.cman .pc { display: block; height: 0; overflow: visible; font: 600 9px system-ui, sans-serif; color: var(--sub); opacity: 0; transition: opacity .15s; }   /* 拖到谁身上，它的额度条下面冒小百分比 */
.cand.reach .cman .pc { opacity: 1; }
.fan.pick .cand { opacity: .35; }
.fan.pick .cand.reach { opacity: 1; }
.cand.reach { z-index: 2; }
.cand.reach .cman { transform: scale(1.3) rotate(-6deg); }   /* 拖到谁身上，谁放大、身子往小克那边一歪（伸手要棒） */
.baton { position: absolute; z-index: 8; width: 5px; height: 15px; border: 1.3px solid #1F1E1C; border-radius: 3px; background: linear-gradient(#FFFFFF 0 50%, #D6483A 50%); pointer-events: none; transition: left .45s cubic-bezier(.4,0,.3,1), top .45s cubic-bezier(.2,-0.6,.6,1), transform .45s; }
.dot .pct { position: absolute; top: 27px; left: 50%; transform: translateX(-50%); font-size: 9.5px; color: var(--sub); white-space: nowrap; display: none; font-family: system-ui, sans-serif; }
.dot.on .pct { display: block; }
.dot.drag { cursor: grabbing; transition: none; z-index: 2; }
.dot.mates { width: 22px; height: 20px; color: var(--sub); cursor: pointer; }
.dot.mates svg { width: 22px; height: 20px; }
.dot.mates:hover { color: var(--ink); transform: scale(1.15); }

/* 唯一的一行小字：固定在最下面，只换字（小组件的说明也写在这里） */
.hint { display: none !important; }   /* 脚下不写字（10-27 用户说了很多遍） */
.hint-old { position: absolute; left: 18px; right: 18px; bottom: 6px; font-size: 13px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hint.warn { color: var(--warn); }
.hint.hot { color: var(--hot); }
/* 学 iPhone「滑动来解锁」：一道光扫过这行字，让人注意到要交棒了 */
.hint.slide { background: linear-gradient(90deg, var(--hot) 0 44%, #F9DCD3 50%, var(--hot) 56% 100%) 0 0 / 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: slideHint 2.4s linear infinite; }
@keyframes slideHint { from { background-position: 100% 0; } to { background-position: -150% 0; } }
@media (prefers-reduced-motion: reduce) { .hint.slide { animation: none; } }
.hint b { color: var(--ink); font-weight: normal; }
.hint a { color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; margin-left: 8px; }

/* 浮窗模式（真插件）：透明底，说明和演示控件收起来 */
body.float { background: transparent; overflow: hidden; }
body.float .wrap { margin: 0; padding: 160px 12px 0; max-width: none; }
body.float .dock { overflow: visible; }   /* 拿起小克往上拖不被看不见的框挡住（10-27 用户） */
body.float .cap, body.float .demo { display: none; }
body.float .dock { background: transparent; }   /* 没有白底：桌面上只看到小克（10-27 用户：怎么还有白边） */
/* 小克头顶的小气泡：只在有事要你决定时出现（换号后接对话） */
/* 新手教学卡：小克右上方一张手绘小卡，大手势图 + 两行字 + 小圆点 */
.teach { position: absolute; z-index: 12; left: 150px; bottom: 96px; display: none; align-items: center; gap: 10px; padding: 10px 14px 32px 12px; width: 270px; max-width: calc(100vw - 24px); background: var(--paper); border: 1.6px solid #1F1E1C; border-radius: 14px 11px 15px 12px; box-shadow: 2px 3px 0 rgba(38,35,31,.1); cursor: pointer; font-family: var(--hand); }
.teach.on { display: flex; animation: teachIn .25s ease-out; }
@keyframes teachIn { from { opacity: 0; transform: translateY(6px); } }
.teach svg { width: 40px; height: 40px; flex: none; }
.teach > div { min-width: 0; flex: 1; }
.teach b { display: block; font-size: 16px; font-weight: normal; color: var(--ink); white-space: normal; overflow-wrap: anywhere; }
.teach b.hot { color: #D77757; }
.teach span { display: block; font-size: 13.5px; color: var(--sub); white-space: normal; overflow-wrap: anywhere; }
.teach i { position: absolute; left: 12px; bottom: 6px; display: flex; gap: 4px; }
.teach em { width: 5px; height: 5px; border-radius: 50%; background: #D8D0C2; }
.teach em.on { background: #D77757; }
.teach .nav { position: absolute; right: 10px; bottom: 3px; display: flex; gap: 10px; }
.teach .nav button { font: inherit; font-size: 12px; color: var(--pencil); border: 0; background: none; padding: 0; cursor: pointer; }
.cand::after { content: attr(data-name); position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 4px; white-space: nowrap; font-size: 12.5px; color: var(--ink); background: var(--paper); border: 1px solid #D8D0C2; border-radius: 8px; padding: 1px 7px; opacity: 0; transition: opacity .15s; pointer-events: none; font-family: var(--hand); }
.cand:hover::after, .cand.reach::after { opacity: 1; }
.lanetag, .lanetip { position: absolute; white-space: nowrap; pointer-events: none; font-family: var(--hand); color: var(--ink); opacity: 0; transition: opacity .2s; }
.lanetag, .lanetip { left: 64px; width: 284px; top: 163px; font-size: 13px; }
.lanetag { text-align: right; }
.lanetip { text-align: left; color: var(--sub); }
.dock.open:not(.team):not(.handing) .lanetag { opacity: 1; }
.dock.open:not(.team):not(.handing) .lanetip.on { opacity: 1; }
.dock.open:not(.team):not(.handing) .lanetip.on + .lanetag, .lanetag.hide { opacity: 0 !important; }   /* 跑道名字和几点回满（10-28 用户：分不清哪条是本周、哪条是 5 小时） */
.who.me::after { content: attr(data-name); position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 2px; white-space: nowrap; font-size: 12.5px; color: var(--ink); background: var(--paper); border: 1.4px solid var(--ink); border-radius: 8px; padding: 1px 7px; pointer-events: none; font-family: var(--hand); }   /* 换号时小克脚下标出「当前」是哪个号（10-28 用户：怕忘了这是 Claude 1 还是 2） */   /* 碰到 / 拖到哪个小人，脚下出它的名字 */
.cand.got .cman { animation: gotHop .5s ease-out; }   /* 接到棒的小人跳一下 */
@keyframes gotHop { 40% { transform: translateY(-8px) scale(1.12); } }
.runner.lift { transform: translateY(-6px) scale(1.06) !important; filter: drop-shadow(0 8px 6px rgba(38,35,31,.25)); cursor: grabbing; }   /* 长按拿起来：浮起一点 */
.fan.on .cand.unavailable, .fan.pick .cand.unavailable.reach { opacity: .35; }
.ask { z-index: 10; position: absolute; left: -8px; bottom: calc(100% + 6px); display: none; white-space: normal; overflow-wrap: anywhere; max-width: calc(100vw - 16px); max-height: 130px; overflow-y: auto; font-size: 13px; color: var(--ink); background: var(--paper); border: 1.5px solid var(--ink); border-radius: 12px 10px 13px 9px; padding: 5px 10px; box-shadow: 2px 3px 0 rgba(38,35,31,.08); }
.ask.on { display: block; }
.ask .message { max-height: 86px; overflow-y: auto; }
.ask .bubble-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
.ask button { white-space: nowrap; position: sticky; bottom: 0; background: var(--paper) !important; font: inherit; background: none; border: 0; padding: 0 0 0 8px; cursor: pointer; color: var(--accent); }
.ask button.no { color: var(--pencil); }
/* 演示控件：跟组件分开，正式版没有 */
.demo { margin-top: 56px; padding: 12px 14px; background: #E2DDD3; border-radius: 10px; font-size: 13px; color: var(--pencil); font-family: system-ui, sans-serif; }
.cap { font-size: 12px; color: var(--pencil); margin: 0 0 6px 4px; line-height: 1.6; }
.demo label { display: flex; align-items: center; gap: 10px; margin-top: 6px; color: var(--sub); }
.demo input[type=range] { flex: 1; accent-color: var(--accent); }
.demo button { font: inherit; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; margin-top: 6px; }
</style>
</head>

  </div>

// 模型快捷：点圆按钮，同一个圆拉开成选择框（图标被吃掉）；宽度跟着最长的模型名；点一行就换，多了能滚；最后一行「自己填…」，回车 = 用它并存下来

}

    d.className = (t === m.model ? "sel " : "") + (t === FILL ? "fill" : m.mine.includes(t) ? "own" : "");
    d.onclick = e => { e.stopPropagation(); if (t === FILL) { if (!isTyping) startOwn(); } else pick(t); };
    reel.append(d);

  if (typing) { const i = $("own"); const go = () => $("mwin").scrollTop = i.parentElement.offsetTop - ROW; go(); setTimeout(go, 400);   /* 框还在拉开时也滚得到 */ i.focus(); i.onkeydown = ownKey; }

function pick(t) { const m = team[cur]; C(m).model = t; drawReel(); tell(L(`<b>${nm(m.name)}</b> 换成了 ${modelText(t, m.acct || m.name)}`, `<b>${nm(m.name)}</b> now uses ${modelText(t, m.acct || m.name)}`)); setTimeout(closeWheel, 160); }
function sayModel() { if (!team.length) return; const m = team[cur]; tell(L(`<b>${nm(m.name)}</b> 现在用 ${modelText(C(m).model, m.acct || (m.name === "小克" ? "Claude" : m.name))} · 点一行就换`, `<b>${nm(m.name)}</b> uses ${modelText(C(m).model, m.acct || (m.name === "小克" ? "Claude" : m.name))} · click a row to switch`)); }

    }

function pickIcon(k) {   // 同一个框里换成一排图标：点一个就定下；「自动」= 交回给负责什么去挑

  cwin.innerHTML = "";
  const g = document.createElement("div"); g.className = "icons";
  Object.keys(ICON).forEach(key => {

    b.className = iconOf(c) === key ? "on" : ""; b.innerHTML = svgKey(key); b.title = L(ICON_NAME[key], ({code:"Code",look:"Research",pen:"Writing",lang:"Translation",bug:"Fix bugs",test:"Testing",draw:"Drawing",sheet:"Spreadsheets",folder:"Organize files",sum:"Summaries",web:"Web tasks",star:"Other"})[key]);
    b.onmouseenter = () => tell(L(`<b>${ICON_NAME[key]}</b>`, `<b>${key}</b>`));

  auto.onclick = e => { e.stopPropagation(); delete c.icon; render(); sayJob(); sizeClones(); cloneRows(); };
  g.append(auto); cwin.append(g);
  cbox.style.width = "176px"; cbox.style.height = "86px"; cbox.style.marginBottom = (30 - 86) / 2 + "px";   // 6 个一排正好放下，不左右滚；多了上下滚
  tell(L("<b>换图标</b> · 点一个就定下", "<b>Pick an icon</b>"));
}
function sizeClones() { if (!team.length) return;   // 量最长那一行，框就拉多宽；只露 3 行，以小牌为中心上下各拉开一点

// 交棒 = 拖着选（10-27 用户：什么时候想交都行；弧放小克头顶、小一点）：按住小克一拖，跑道先淡出，能接棒的号从小克身上弹出来，在它头顶排成一道小弧，
// 排第一的在最上面；拖到谁身上，谁转过来伸手要棒，别的变淡；松手 = 棒飞过去，再交棒；松在空地 = 他们跑回右边。点排里的人也能交
let rdrag = null;
function fanPos(k, n) {   // 小克头顶一道小弧（10-27 用户：别跟跑道搭在一起，别太大），每个离小克一样远
  const d = dock.getBoundingClientRect(), wl = parseFloat(who.style.left) || BAR_L, rw = runner.offsetWidth, rh = runner.offsetHeight;
  const R = 66, top = d.height - 70 - rh;   // 小克头顶那条线
  const cx = Math.max(R + 18, Math.min(d.width - R - 18, wl + rw / 2)), cy = top + 14;
  const a = (n === 1 ? -90 : -168 + 156 * k / (n - 1)) * Math.PI / 180;   // 从左下绕过头顶到右下
  return { x: cx + R * Math.cos(a), y: Math.max(20, cy + R * Math.sin(a) * .82) };
}
function openFan() {
  if (fan.classList.contains("on")) return;

  rl.forEach((m, k) => {
    const el = document.createElement("div"), p = fanPos(k, rl.length);
    el.className = "cand" + (canHandoff(m) ? "" : " unavailable"); el.style.left = p.x + "px"; el.style.top = p.y + "px";
    el.style.transitionDelay = (k * 35) + "ms";   // 从小克身上一个个弹出来，排到头顶
    const wl = parseFloat(who.style.left) || BAR_L; el.style.setProperty("--fx", (wl + runner.offsetWidth / 2 - p.x) + "px"); el.style.setProperty("--fy", (dock.clientHeight - 90 - p.y) + "px");
    const w = SIZE[m.look + "-站"][0] * .5, q = (m.left == null ? `<b class="q none"></b>` : `<b class="q"><i style="width:${Math.round(m.left * 100)}%;background:${m.fill}"></i></b>`) + `<b class="pc">${m.left == null ? "?" : Math.round(m.left * 100) + "%"}</b>`;
    el.innerHTML = `<div class="cman"><img alt="" src="${SRC[m.look + "-站"]}" style="width:${w}px">${q}</div>`;   // 头顶不冒字：名字和还剩多少写在脚下那一行
    el.addEventListener("click", e => { e.stopPropagation(); passTo(m, el); });
    el.addEventListener("mouseenter", () => { if (!rdrag) { el.classList.add("reach"); fan.classList.add("pick"); tell(L(`<b>交给 ${nm(m.name)}</b> · ${quotaSay(m)} · 点一下或把小克拖过来`, `<b>Hand to ${nm(m.name)}</b> · ${quotaSay(m)} · click, or drag Clawd here`)); } });
    el.addEventListener("mouseleave", () => { if (!rdrag) { el.classList.remove("reach"); fan.classList.remove("pick"); hideTip(); } });
    m.cand = el; fan.append(el);
  });

}
function closeFan() { fan.classList.remove("on", "pick"); team.forEach(m => m.cand && m.cand.classList.remove("reach")); }
const canHandoff = m => !m.acct && (m.name === "Codex" || m.name === "Antigravity") && m.installed === true && m.login !== "no";   // 10-28 用户：换号 = Claude、Codex、Gemini（Antigravity）
function passTo(m, el) {   // 棒从小克手里划一道弧飞到接棒的手里，然后交棒
  const d = dock.getBoundingClientRect(), a = runner.getBoundingClientRect(), b = el.querySelector("img").getBoundingClientRect();
  const bt = document.createElement("i"); bt.className = "baton";
  bt.style.left = (a.right - d.left - 10) + "px"; bt.style.top = (a.top - d.top + a.height * .35) + "px";
  dock.append(bt); void bt.offsetWidth;
  bt.style.left = (b.left - d.left + b.width * .2) + "px"; bt.style.top = (b.top - d.top + b.height * .55) + "px"; bt.style.transform = "rotate(-320deg)";
  tell(L(`<b>交给 ${nm(m.name)}</b>`, `<b>Handing to ${nm(m.name)}</b>`));
  setTimeout(() => { bt.remove(); closeFan(); hand(m); }, 480);
}
runner.addEventListener("pointerdown", e => {

      if (seen && (m.acct || ai === "Claude") && m.installed !== false) {
        const who = m.acct ? m.name : ai;
        bubble(safeBubbleText(L("去 " + ai + " 里退出，登录 " + who, "Sign out in " + ai + " and sign in to " + who)), [{t:L("知道了","Got it"),no:true}]);
        return;
      }
      if (m.installed === false) text = L(ai + " 没装", ai + " is not installed");
      else if (m.acct || ai === "Claude") text = ai === "Claude"
        ? L("换号后小克问「接过来旧号的对话？」→ 点「挑一挑」→ 照左侧栏样子的清单里勾要搬的（默认勾做到一半的）→ 点「接过来」→ 在 Claude 里按发送 → 只搬勾的，分支照原样挂好。", "After switching, Clawd asks “Bring over chats from the old account?” → click Choose chats → check the chats in a list arranged like your sidebar (in-progress chats are checked by default) → click Bring over → press Send in Claude → only checked chats move, with branches kept in their original places.")
        : L("在 " + ai + " 里退出，再登录另一个号", "Sign out in " + ai + " and sign in to the other account");
      else text = m.login === "no" ? L(ai + " 没登录", ai + " is not signed in") : L("现在还不能交给 " + ai + "，帮助里有说明", "Cannot hand off to " + ai + " yet. See Help.");
      if (seen && !(m.acct || ai === "Claude")) text = text.split(/[，。,.]/)[0];   // 看过的只留第一句，但每次都有反应
      bubble(safeBubbleText(text), [{t:L("知道了","Got it"),no:true}]);
      return;
    }
    closeFan();
    for (const pending of handoffRequests.values()) { pending.voided = true; clearTimeout(pending.timer); }
    const queue = { m, el, left:3, timer:null };
    countdown = queue;
    const paint = () => bubble(L(queue.left + " 秒后交给 " + nm(m.name), "Hand off to " + nm(m.name) + " in " + queue.left + " seconds"), [{t:L("撤销","Undo"), f:()=>{ cancelCountdown(); bubbleUntil=0; }}], true);
    paint();
    queue.timer = setInterval(() => {
      if (countdown !== queue) return;
      queue.left--;
      if (queue.left > 0) { paint(); return; }
      cancelCountdown();
      sendHandoff(m, el);
    }, 1000);
  };
  function sendHandoff(m, el) {
    const id = Date.now() + "-" + Math.random().toString(36).slice(2);
    pendingHandoff = { id, m, el, timer:setTimeout(() => {
      if (pendingHandoff?.id === id) pendingHandoff = null;
      bubble(L("3 分钟内没有收到交接回执；收到结果后会更新", "No handoff receipt within 3 minutes; the result will update when received"), [{t:L("知道了","Got it"),no:true}]);
    }, 180000) };
    handoffRequests.set(id, pendingHandoff);
    bubble(L("正在交给 " + nm(m.name) + "…", "Handing over to " + nm(m.name) + "…"), [], true);
    window.clawdex.send({ type: "handoff", to: m.name, requestId:id });
  };
  autoRelay = function () { if (used() >= 100) openFan(); };
  const fanOrig = openFan;
  openFan = function () {
    const all = team;   // 换号的弧只放真能换过去的：能交接的 AI、手动加的号、原来的 Claude（10-28：Antigravity 不能换过去，却出现在弧上）
    const handOnly = ["Codex", "Antigravity"].filter(n => !all.some(m => m.name === n)).map(n => (lastState?.known || []).find(k => k.name === n)).filter(k => k && k.installed && k.login !== "no")
      .map(k => ({ name: k.name, look: (LOOK[k.name] || ["通用-蓝"])[0], fill: (LOOK[k.name] || [, "#4A7BF0"])[1], installed: true, login: k.login, left: null, models: MODELS[k.name] || [], ci: 0, clones: [{ model: "default", job: "", task: 0, mine: [] }] }));   // 不在委派名单里、但能换过去的（Gemini）也放上弧
    team = [...all.filter(m => canHandoff(m) || m.acct || m.name === "小克"), ...handOnly];
    try { fanOrig(); } finally { team = all; }
    team.forEach(m => { if (m.cand) m.cand.dataset.name = m.acct ? m.name : m.name === "小克" ? stateAccount.label : nm(m.name); });
    who.dataset.name = currentAccount() + L(" · 当前", " · current"); who.classList.add("me");   // 跟别家账号切换器一样，标出现在用的是哪个
  };
  const fanShut = closeFan;
  closeFan = function () { fanShut(); who.classList.remove("me"); };
  // 透明的地方鼠标直接穿过去（不挡后面的窗口、输入框、语音按钮）；碰到小克这些东西才接住
  const EMPTY = el => !el || el === document.documentElement || el === document.body || el.classList.contains("wrap") || el === dock || el === stage;
  let through = true;
  document.addEventListener("mousemove", e => {
    const t = EMPTY(e.target) && !mv && !press && !lifted && !ctx.classList.contains("on") && !teach.classList.contains("on");   // 按着小克、拿起小克的时候一直接住鼠标，不然一移到透明处就拖不动了（10-27）
    if (t !== through) { through = t; window.clawdex.through(t); }
  });
  // 右键菜单里加「挪位置」「关掉浮窗」（浮窗没有边框、不在任务栏；右下角托盘图标里也能关）
  const item = (zh, en, fn) => {
    const b = document.createElement("button");
    b.innerHTML = `<span>${L(zh, en)}</span>`; b.dataset.zh = zh; b.dataset.en = en;
    b.addEventListener("click", e => { e.stopPropagation(); ctx.classList.remove("on"); fn(); });
    ctx.append(b);
  };
  item("退出", "Quit", () => { window.clawdex.send({ type: "closed" }); window.clawdex.close(); });   // 大家都写「退出」（10-27 用户：别写那么多字）
  const relabel = paintLang;
  paintLang = function () { relabel(); ctx.querySelectorAll("button[data-zh]").forEach(b => { b.querySelector("span").textContent = L(b.dataset.zh, b.dataset.en); }); };
  // 右键菜单：点了一项、点别的地方、切到别的程序、按 Esc 都收起（10-27 用户：菜单一直在那儿关不掉）
  const shut = () => ctx.classList.remove("on");
  window.addEventListener("blur", shut);
  document.addEventListener("keydown", e => { if (e.key === "Escape") shut(); });
  new MutationObserver(() => { if (ctx.classList.contains("on")) { through = false; window.clawdex.through(false); } }).observe(ctx, { attributes: true, attributeFilter: ["class"] });
  // 小克身上的手（10-27 用户定）：按住直接拖 = 挪浮窗（跟所有桌宠一样）；长按不动 = 把小克拿起来 = 交棒
  //   学灵感库 564 Slipstone：点 = 做事、长按 = 把石头拿起来；拿起来后头顶冒出能接棒的小人，拖到谁身上松手 = 交给它，
  //   不拖就松手 = 小人留着，点一个也能交（拖拽一定要有不用拖的办法，ui-flow 二-14）；松在空地 = 放下不交
  //   窗口跟着鼠标走由主程序做（每帧读鼠标位置），拖快了、往下拖也不会丢
  let press = null, mv = false, lifted = null;
  const near = (x, y) => {   // 离手最近的那个小人（46 像素以内）
    let best = null, bd = 46;
    team.forEach(m => { if (!m.cand) return; const r = m.cand.querySelector("img").getBoundingClientRect(), d = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2)); if (d < bd) { bd = d; best = m; } });
    return best;
  };
  document.addEventListener("pointerdown", e => {
    if (!runner.contains(e.target) || e.button !== 0 || busy) return;
    e.stopPropagation();   // 不走原来「一按就拖着交棒」
    clearTimeout(dwell);   // 按下去就不是「碰」，不冒队友
    runner.setPointerCapture(e.pointerId);
    through = false; window.clawdex.through(false);
    press = { x: e.clientX, y: e.clientY, t: setTimeout(() => {   // 长按 0.45 秒不动 = 拿起来
      press = null; lifted = { x: e.clientX, y: e.clientY, moved: false };
      setTeam(false); runner.classList.add("lift"); openFan();
    }, 450) };
  }, true);
  document.addEventListener("pointermove", e => {
    if (press && !mv && Math.abs(e.clientX - press.x) + Math.abs(e.clientY - press.y) > 4) {   // 没等到长按就动了 = 挪浮窗
      clearTimeout(press.t); press = null; mv = true; setTeam(false);
      window.clawdex.dragStart();
      return;
    }
    if (!lifted) return;
    const dx = e.clientX - lifted.x, dy = e.clientY - lifted.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) lifted.moved = true;
    runner.style.transform = `translate(${dx}px, ${dy}px)`;
    const best = near(e.clientX, e.clientY);
    team.forEach(m => m.cand && m.cand.classList.toggle("reach", m === best));
    fan.classList.toggle("pick", !!best);
  }, true);
  document.addEventListener("pointerup", e => {
    if (press) { clearTimeout(press.t); press = null; return; }   // 只是点了一下：照常开跑道
    if (!mv && !lifted) return;
    runner.dataset.justDragged = "1";
    if (mv) { mv = false; window.clawdex.dragEnd(); return; }
    const moved = lifted.moved, best = near(e.clientX, e.clientY);
    lifted = null; runner.classList.remove("lift"); runner.style.transform = "";
    if (best && moved) passTo(best, best.cand);
    else if (moved) closeFan();   // 松在空地 = 放下不交
  }, true);
  // 新手教学：第一次打开浮窗，在小克旁边一张张教完所有操作（10-28 用户挑 C：手绘手势小图、字少）
  //   点一下 和 长按 分清楚（长按那张用橙色写「按住不放」）；最后一张告诉他们看不懂去哪找帮助；点卡片 = 下一张，「跳过」= 不再出现
  const HAND = '<path d="M11 21 V11 a2 2 0 0 1 4 0 V19 M15 17 a2 2 0 0 1 4 0 V20 M19 18 a2 2 0 0 1 4 0 V22 c0 5 -3 8 -7 8 c-3 0 -5 -2 -7 -5 l-3 -5 a2 2 0 0 1 3 -2 l2 3"/>';
  const ICONS = {
    hover: '<path d="M10 6 L10 25 L15 20 L18.5 28 L21.5 26.6 L18 19 L25 19 Z"/><path d="M26 6 c2 1 3 3 3 5 M23 8 c1 .6 1.6 1.6 1.6 2.8" stroke="#D77757"/>',
    tap: HAND + '<path d="M9 5 l2 3 M13 3 v3.5 M17 5 l-2 3" stroke="#D77757"/>',
    drag: HAND + '<path d="M2 9 h6 M4 7 l-2 2 l2 2 M32 9 h-6 M30 7 l2 2 l-2 2" stroke="#D77757"/>',
    hold: HAND + '<path d="M13 4.5 a6.5 6.5 0 1 1 -4.6 1.9" stroke="#D77757"/><path d="M8 3 l.5 3.5 l3.3 -.9" stroke="#D77757"/>',
    right: '<path d="M10 7 c0 -3 3 -4 7 -4 s7 1 7 4 v14 c0 5 -3 8 -7 8 s-7 -3 -7 -8 Z M10 13 h14 M17 3 v10"/><path d="M17.6 3.6 c3 0 5.8 .8 5.8 3.4 v5.4 h-5.8 Z" fill="#D77757" stroke="none"/>',
    intro: '<path d="M17 4 l2.6 7.4 l7.4 2.6 l-7.4 2.6 l-2.6 7.4 l-2.6 -7.4 l-7.4 -2.6 l7.4 -2.6 Z"/><path d="M27 22 l1 3 l3 1 l-3 1 l-1 3 l-1 -3 l-3 -1 l3 -1 Z" stroke="#D77757"/>',
    acct: '<path d="M8 13 a5 5 0 1 1 10 0 a5 5 0 1 1 -10 0 Z M3 29 c0 -6 4.5 -9 10 -9 s10 3 10 9"/><path d="M27 9 v10 M22 14 h10" stroke="#D77757"/>',
    help: '<path d="M17 30 a12 12 0 1 1 0 -24 a12 12 0 1 1 0 24 Z"/><path d="M13 14 c0 -3 2 -4.5 4.2 -4.5 c2.4 0 4.2 1.5 4.2 3.8 c0 3.2 -4.2 3.2 -4.2 6.4 M17.2 23.6 v.6" stroke="#D77757"/>',
  };
  const STEPS = () => [
    ["intro", L("克代同堂能做三件事", "Clawdex does three things"), L("派小活给别的 AI（目前 Claude 和 Codex 互相派）、看额度、换号。Gemini：装 Google 的 Antigravity 登录，用的还是你的 Gemini 会员", "Hand small tasks to other AIs (currently Claude and Codex, either way), watch quota, switch accounts. Gemini: install Google’s Antigravity and sign in; it uses your Gemini plan")],   // 第一次打开先说这是什么（10-28 用户：进来的时候要介绍有哪些功能）
    ["hover", L("碰一下小克", "Hover Clawd"), L("看队友", "See teammates")],
    ["tap", L("点一下", "Click"), L("开跑道（额度）：显示快用完的那条（5 小时或本周），点条换另一条", "Open the track (quota): shows whichever limit (5-hour or week) is closer to running out; click the bar for the other")],
    ["drag", L("按住直接拖", "Press and drag"), L("挪位置", "Move it")],
    ["hold", L("按住不放", "Press and hold"), L("换号：按住不动，等队友冒出来，拖到谁身上就交给谁，3 秒内能撤销", "Switch account: hold still until teammates appear, then drop on one; undo within 3 seconds")],
    ["acct", L("还有第二个号？", "Got another account?"), L("Claude 换好号会自己认出来；别家 AI 的第二个号：右键 → 管理队友 → 换号，加一下", "Claude accounts are detected after you switch; for other AIs: Right-click → Teammates → Switch, add it")],   // Claude 自动识别，别家 AI 的第二个号手动加
    ["right", L("右键", "Right-click"), L("语言、管理队友、退出", "Language, teammates, quit")],
    ["help", L("还是不懂？", "Still lost?"), L("右键 → 管理队友 → 帮助。找不到小克：双击桌面的「克代同堂」", "Right-click → Teammates → Help. Can’t find Clawd? Double-click “Clawdex” on the desktop")],
  ];
  const teach = document.createElement("div");
  teach.className = "teach";
  dock.append(teach);
  let step = -1;
  const doneTeach = () => { teach.classList.remove("on"); step = -1; try { localStorage.setItem("clawdex.taught", "4"); } catch (e) {} };
  const showStep = () => {
    const all = STEPS(), [ic, act, res] = all[step];
    teach.innerHTML = `<svg viewBox="0 0 34 34" fill="none" stroke="#26231F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[ic]}</svg>`
      + `<div><b class="${ic === "hold" ? "hot" : ""}">${act}</b><span>${res}</span></div>`
      + `<i>${all.map((_, k) => `<em class="${k === step ? "on" : ""}"></em>`).join("")}</i><div class="nav">${step > 0 ? `<button class="prev">${L("上一步", "Back")}</button>` : ""}<button class="next">${step === all.length - 1 ? L("完成", "Done") : L("下一步", "Next")}</button><button class="skip">${L("跳过", "Skip")}</button></div>`;
    const prev = teach.querySelector(".prev");
    if (prev) prev.onclick = e => { e.stopPropagation(); step--; showStep(); };
    teach.querySelector(".next").onclick = e => { e.stopPropagation(); step++; if (step >= all.length) doneTeach(); else showStep(); };
    teach.querySelector(".skip").onclick = e => { e.stopPropagation(); doneTeach(); };
    teach.classList.add("on");
    through = false; window.clawdex.through(false);
  };
  teach.addEventListener("click", e => { e.stopPropagation(); step++; if (step >= STEPS().length) doneTeach(); else showStep(); });
  let taught = "";
  try { taught = localStorage.getItem("clawdex.taught") || ""; } catch (e) {}
  if (taught !== "4") setTimeout(() => { step = 0; showStep(); }, 800);
  // 换主角后，按插件真名单重建队友，并刷新该主角的真实额度。
  const handOrig = hand;
  hand = function (m) {
    handedAt = Date.now(); handOrig(m); setTimeout(() => { if (lastState) onSt(lastState); }, 800); return;   // 换完人按真名单重排一次
  };
}
</script>
</body>
